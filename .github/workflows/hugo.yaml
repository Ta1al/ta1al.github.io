name: Build and deploy Hugo site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      NODE_VERSION: 24
      TZ: Asia/Karachi
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test live status integrations
        run: node --test .github/scripts/*.test.mjs

      - name: Restore last successful Valorant rank
        id: valorant-rank-cache
        uses: actions/cache/restore@v5
        with:
          path: data/valorant.json
          key: valorant-rank-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            valorant-rank-

      - name: Refresh Valorant rank
        id: valorant-rank
        continue-on-error: true
        run: node .github/scripts/fetch-valorant-status.mjs

      - name: Cache successful Valorant rank
        if: steps.valorant-rank.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: data/valorant.json
          key: valorant-rank-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report cached Valorant rank fallback
        if: steps.valorant-rank.outcome == 'failure'
        env:
          CACHE_HIT: ${{ steps.valorant-rank-cache.outputs.cache-matched-key }}
        run: |
          if [ -n "$CACHE_HIT" ]; then
            echo "::warning::Valorant rank refresh failed; deploying the last successfully fetched rank."
          else
            echo "::warning::Valorant rank refresh failed and no previous workflow cache exists; deploying the committed rank data."
          fi

      - name: Install Hugo Extended
        run: |
          curl -sfL --output "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo tar -C /usr/local/bin -xzf "${{ runner.temp }}/hugo.tar.gz" hugo
          hugo version

      - name: Build
        run: >-
          hugo --gc --minify
          --baseURL "${{ steps.pages.outputs.base_url }}/"
          --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
