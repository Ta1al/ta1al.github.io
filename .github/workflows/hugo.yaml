name: Build and deploy Hugo site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      NODE_VERSION: 24
      TZ: Asia/Karachi
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Validate data, test, and lint
        run: |
          npm run validate:data
          npm test
          npm run lint

      - name: Restore last successful Valorant rank
        id: valorant-rank-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: data/valorant.json
          key: valorant-rank-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            valorant-rank-

      - name: Refresh Valorant rank
        id: valorant-rank
        continue-on-error: true
        run: node .github/scripts/fetch-valorant-status.mjs

      - name: Commit refreshed Valorant rank
        if: steps.valorant-rank.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/valorant.json
          if git diff --cached --quiet; then
            echo "Valorant rank data is unchanged."
            exit 0
          fi
          git commit -m "chore(valorant): update rank data"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Cache successful Valorant rank
        if: steps.valorant-rank.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: data/valorant.json
          key: valorant-rank-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report cached Valorant rank fallback
        if: steps.valorant-rank.outcome == 'failure'
        env:
          CACHE_HIT: ${{ steps.valorant-rank-cache.outputs.cache-matched-key }}
        run: |
          if [ -n "$CACHE_HIT" ]; then
            echo "::warning::Valorant rank refresh failed; deploying the last successfully fetched rank."
          else
            echo "::warning::Valorant rank refresh failed and no previous workflow cache exists; deploying the committed rank data."
          fi

      - name: Install Hugo Extended
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          checksums="hugo_${HUGO_VERSION}_checksums.txt"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -sfL --output "${{ runner.temp }}/${archive}" "${release}/${archive}"
          curl -sfL --output "${{ runner.temp }}/${checksums}" "${release}/${checksums}"
          (
            cd "${{ runner.temp }}"
            grep " ${archive}$" "${checksums}" | sha256sum --check -
          )
          sudo tar -C /usr/local/bin -xzf "${{ runner.temp }}/${archive}" hugo
          hugo version

      - name: Build
        run: >-
          hugo --gc --minify
          --baseURL "${{ steps.pages.outputs.base_url }}/"
          --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Validate generated site and asset budgets
        run: npm run validate:site

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Test browser behavior and accessibility
        run: npm run test:e2e:built

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
