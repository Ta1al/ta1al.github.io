<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Common incident path from exposed trust to recovery</title>
  <desc id="desc">A six-stage flow from exposed service or trusted integration through a control gap, unauthorized access, attacker action, business impact, and containment and recovery.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop stop-color="#0d1c1d"/>
      <stop offset="1" stop-color="#0b1112"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ce1cf"/>
    </marker>
  </defs>
  <rect width="1400" height="430" rx="20" fill="#080c0d"/>
  <text x="70" y="74" fill="#5ce1cf" font-family="ui-monospace, monospace" font-size="24" letter-spacing="3">A RECURRING INCIDENT PATH</text>
  <g fill="url(#panel)" stroke="#294245" stroke-width="2">
    <rect x="70" y="130" width="180" height="180" rx="12"/>
    <rect x="286" y="130" width="180" height="180" rx="12"/>
    <rect x="502" y="130" width="180" height="180" rx="12"/>
    <rect x="718" y="130" width="180" height="180" rx="12"/>
    <rect x="934" y="130" width="180" height="180" rx="12"/>
    <rect x="1150" y="130" width="180" height="180" rx="12"/>
  </g>
  <g stroke="#5ce1cf" stroke-width="3" marker-end="url(#arrow)">
    <path d="M250 220h28"/><path d="M466 220h28"/><path d="M682 220h28"/><path d="M898 220h28"/><path d="M1114 220h28"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle">
    <g fill="#f0f5f5" font-size="22" font-weight="700">
      <text x="160" y="180"><tspan x="160">Exposed</tspan><tspan x="160" dy="28">trust</tspan></text>
      <text x="376" y="180"><tspan x="376">Control</tspan><tspan x="376" dy="28">gap</tspan></text>
      <text x="592" y="180"><tspan x="592">Unauthorized</tspan><tspan x="592" dy="28">access</tspan></text>
      <text x="808" y="180"><tspan x="808">Attacker</tspan><tspan x="808" dy="28">action</tspan></text>
      <text x="1024" y="180"><tspan x="1024">Business</tspan><tspan x="1024" dy="28">impact</tspan></text>
      <text x="1240" y="180"><tspan x="1240">Contain and</tspan><tspan x="1240" dy="28">recover</tspan></text>
    </g>
    <g fill="#9babad" font-size="16">
      <text x="160" y="257"><tspan x="160">SaaS · ERP</tspan><tspan x="160" dy="23">CI/CD · CMS</tspan></text>
      <text x="376" y="257"><tspan x="376">Weak identity</tspan><tspan x="376" dy="23">Patch or config</tspan></text>
      <text x="592" y="257"><tspan x="592">Token, exploit,</tspan><tspan x="592" dy="23">or public asset</tspan></text>
      <text x="808" y="257"><tspan x="808">Exfiltration,</tspan><tspan x="808" dy="23">persistence, release</tspan></text>
      <text x="1024" y="257"><tspan x="1024">Data, operations,</tspan><tspan x="1024" dy="23">trust, notification</tspan></text>
      <text x="1240" y="257"><tspan x="1240">Revoke · isolate</tspan><tspan x="1240" dy="23">patch · communicate</tspan></text>
    </g>
  </g>
  <text x="70" y="375" fill="#718184" font-family="ui-monospace, monospace" font-size="17">The entry point changes; the need to constrain trust, observe behavior, and rehearse response does not.</text>
</svg>
