baseURL = 'https://ta1al.com'
locale = 'en-US'
title = 'Talal Ahmed'
enableRobotsTXT = true

[params]
  description = 'Portfolio of Talal Ahmed, a SOC Analyst and Software Engineer.'
  author = 'Talal Ahmed'

[[params.socials]]
  name = 'GitHub'
  url = 'https://github.com/ta1al'
  icon = 'github'

[[params.socials]]
  name = 'LinkedIn'
  url = 'https://www.linkedin.com/in/ta1al/'
  icon = 'linkedin'

[[params.socials]]
  name = 'Email'
  url = 'mailto:mail@ta1al.com'
  icon = 'email'

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

[[menus.main]]
  name = 'Home'
  pageRef = '/'
  weight = 10

[[menus.main]]
  name = 'About'
  pageRef = '/about'
  weight = 20

[[menus.main]]
  name = 'Achievements'
  pageRef = '/achievements'
  weight = 30

[[menus.main]]
  name = 'Projects'
  pageRef = '/projects'
  weight = 40

[[menus.main]]
  name = 'Blog'
  pageRef = '/blog'
  weight = 50

[[menus.main]]
  name = 'CV'
  pageRef = '/cv'
  weight = 60

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = false

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']

[caches]
  [caches.images]
    dir = ':cacheDir/images'
