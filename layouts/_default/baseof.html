<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>{{ partial "head.html" . }}</head>
  <body class="page page--{{ .Kind }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {{ partial "header.html" . }}
    <main id="main">{{ block "main" . }}{{ end }}</main>
    {{ partial "footer.html" . }}
    {{ partial "script-bundle.html" "js/site.mjs" }}
    {{ block "scripts" . }}{{ end }}
  </body>
</html>
