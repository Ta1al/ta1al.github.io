{{ define "main" }}
<section class="hero" aria-labelledby="hero-title">
  <div class="hero__content">
    <p class="eyebrow reveal">Identity // Portfolio</p>
    <h1 id="hero-title" class="reveal">Talal Ahmed</h1>
    <p class="hero__title reveal">SOC Analyst <span aria-hidden="true">&amp;</span><span class="sr-only">and</span> Software Engineer</p>
    <ul class="socials reveal" aria-label="Social links">
      {{ range site.Params.socials }}
      <li><a href="{{ .url }}" {{ if strings.HasPrefix .url "http" }}target="_blank" rel="noreferrer"{{ end }} aria-label="{{ .name }}" title="{{ .name }}">{{ partial "social-icon.html" .icon }}</a></li>
      {{ end }}
    </ul>
  </div>
</section>
{{ end }}
