<div class="article-meta">
  <span>Published <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time></span>
  <span>{{ .ReadingTime }} min read</span>
  {{ if ne .Lastmod .Date }}<span>Updated <time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ .Lastmod.Format "02 Jan 2006" }}</time></span>{{ end }}
</div>
