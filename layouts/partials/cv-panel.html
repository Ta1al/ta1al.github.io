{{- $resume := .resume -}}
{{- $id := .id -}}
<section id="cv-panel-{{ $id }}" class="cv-panel{{ if .active }} is-active{{ end }}" role="tabpanel" aria-labelledby="cv-tab-{{ $id }}" data-cv-panel="{{ $id }}"{{ if not .active }} tabindex="0"{{ end }}>
  {{ partial "cv-featured.html" (dict "resume" $resume) }}
  <div class="cv__grid">
    {{ partial "cv-sidebar.html" (dict "resume" $resume "id" $id) }}
    {{ partial "cv-main.html" (dict "resume" $resume "id" $id) }}
  </div>
</section>
