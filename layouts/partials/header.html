<header class="site-header{{ if .IsHome }} site-header--home{{ end }}">
  {{ if not .IsHome }}
  <a class="site-mark" href="{{ site.Home.RelPermalink }}" aria-label="Talal Ahmed, home">Ta<span>1</span>al</a>
  {{ end }}
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Toggle navigation menu. On touch screens, swipe left to toggle.">
    <span class="menu-toggle__desktop-label">Menu</span>
    <span class="menu-toggle__mobile-label" aria-hidden="true">Swipe &laquo;</span>
    <span class="menu-toggle__lines" aria-hidden="true"></span>
  </button>
  <div class="menu" id="site-menu" hidden>
    <nav aria-label="Primary navigation">
      <a href="{{ site.Home.RelPermalink }}">Home</a>
      <a href="{{ relURL "about/" }}">About</a>
      <a href="{{ relURL "cv/" }}">CV</a>
      <a href="{{ relURL "projects/" }}">Projects</a>
      <a href="{{ relURL "blog/" }}">Blog</a>
    </nav>
  </div>
</header>
