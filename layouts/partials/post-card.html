<article class="post-card">
  <div class="post-card__date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time><span>{{ .ReadingTime }} min</span></div>
  <div><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Description | default .Summary }}</p>{{ with .GetTerms "tags" }}<ul class="tag-list">{{ range first 4 . }}<li>{{ .LinkTitle }}</li>{{ end }}</ul>{{ end }}</div>
  <a class="post-card__arrow" href="{{ .RelPermalink }}" aria-label="Read {{ .Title }}"><span aria-hidden="true">↗</span></a>
</article>
