<article class="project-card" data-project-discipline="{{ .Params.discipline | default "software" }}">
  <div class="project-card__meta"><span>{{ .Params.discipline | default "Project" | humanize }}</span><span>{{ .Date.Format "2006" }}</span></div>
  <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <p>{{ .Description | default .Summary }}</p>
  {{ with .Params.technologies }}<ul class="tag-list" aria-label="Technologies">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>{{ end }}
  <a class="text-link" href="{{ .RelPermalink }}" aria-label="Read the {{ .Title }} case study">View case study <span aria-hidden="true">↗</span></a>
</article>
