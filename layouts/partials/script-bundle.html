{{- $options := dict "minify" true "target" "es2020" -}}
{{- $source := resources.Get . -}}
{{- if not $source -}}
  {{- errorf "JavaScript entry point %q was not found" . -}}
{{- end -}}
{{- $bundle := $source | js.Build $options | fingerprint -}}
<script type="module" src="{{ $bundle.RelPermalink }}" integrity="{{ $bundle.Data.Integrity }}"></script>
